{% extends 'base.html' %}
{% block content %}
<div class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-2xl w-full border border-slate-200">
        <h2 class="text-xl font-bold text-slate-900 mb-1">Vérification de l'Annuaire Employé</h2>
        <p class="text-sm text-slate-500 mb-6">Veuillez compléter vos informations d'identification RH.</p>

        <form action="/submit-profile" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" name="email" value="{{ email }}">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nom</label>
                <input type="text" name="nom" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Post-nom</label>
                <input type="text" name="postnom" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Poste / Fonction</label>
                <input type="text" name="poste" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Genre</label>
                <select name="genre" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="M">Masculin</option>
                    <option value="F">Féminin</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">CUS NUM (Matricule Client)</label>
                <input type="text" name="cus_num" placeholder="Ex: CUS-9982" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Date de naissance</label>
                <input type="date" name="date_naissance" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">État Civil</label>
                <select name="etat_civil" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="Célibataire">Célibataire</option>
                    <option value="Marié(e)">Marié(e)</option>
                    <option value="Divorcé(e)">Divorcé(e)</option>
                    <option value="Veuf(ve)">Veuf(ve)</option>
                </select>
            </div>

            <div class="md:col-span-2 mt-4">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition duration-200">
                    Enregistrer les informations
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
