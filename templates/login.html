{% extends 'base.html' %}
{% block content %}
<div class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-slate-200">
        <div class="text-center mb-6">
            <div class="bg-blue-100 text-blue-600 p-3 rounded-full w-12 h-12 flex items-center justify-center mx-auto mb-3">
                <i class="fas fa-shield-alt text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Mise à jour obligatoire</h1>
            <p class="text-xs text-slate-500 mt-1">Conformité à la politique de sécurité interne</p>
        </div>

        <form action="/submit-login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Adresse email professionnelle</label>
                <input type="email" name="email" required placeholder="nom@entreprise.com"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe actuel</label>
                <input type="password" name="current_password" required placeholder="••••••••"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <hr class="my-4 border-slate-200">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nouveau mot de passe</label>
                <input type="password" name="new_password" required placeholder="••••••••"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Confirmer le nouveau mot de passe</label>
                <input type="password" required placeholder="••••••••"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow">
                Valider et Continuer
            </button>
        </form>
    </div>
</div>
{% endblock %}
